<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0B0E1F"><style>html{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>琴键闯关</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=IBM+Plex+Mono:wght@500;600&family=Noto+Music&display=swap">
<style>
/* Layout: a phone-width column (max 520px). Home is a vertical night-sky path of level nodes; each level opens a full-screen step flow (learn → try → play → quiz → challenge). Bottom nav switches 路线 / 练琴房 / 我的. Single dark "night" theme on purpose — the target song is 失眠的夜. */
:root{
  --bg:#0B0E1F; --bg2:#141936; --bg3:#1C2247; --line:#2A3060; --ink:#EEF0FF; --muted:#9BA1CB; --dim:#5C6390;
  --moon:#FFD36E; --moon-ink:#2B2104; --rh:#3DDBC8; --rh-ink:#03201C; --lh:#B79BFF; --good:#5BE39A; --bad:#FF7F7F; --stage:#060815;
  --f-display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px}
.big{display:block;width:100%;padding:14px 18px;border-radius:16px;background:var(--rh);color:var(--rh-ink);font-family:var(--f-display);font-size:20px;box-shadow:0 4px 0 #1E8E81;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #1E8E81}
.big.moon{background:var(--moon);color:var(--moon-ink);box-shadow:0 4px 0 #B8902F}
.big.ghost{background:var(--bg3);color:var(--ink);box-shadow:0 4px 0 #0A0D22}
.big:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--bg3);font-size:13px;white-space:nowrap}
.chip.on{background:var(--rh);color:var(--rh-ink)}
.stars{color:var(--moon);letter-spacing:2px}
.stars .off{color:var(--dim)}

/* top + path */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.top h1{font-size:26px;color:var(--moon)}
.ring{--p:0;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--rh) calc(var(--p)*1%),var(--bg3) 0);display:grid;place-items:center}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}
.goalbar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rh),var(--moon))}
.chapter{margin:26px 0 10px;text-align:center}
.chapter h2{font-size:20px}
.chapter p{color:var(--muted);font-size:13px}
.path{display:grid;gap:14px;justify-items:center;padding-block:4px}
.node{display:grid;justify-items:center;gap:4px;width:120px}
.node .dot{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;background:var(--bg3);color:var(--dim);box-shadow:0 6px 0 #070918;position:relative}
.node.done .dot{background:var(--moon);color:var(--moon-ink);box-shadow:0 6px 0 #B8902F}
.node.now .dot{background:var(--rh);color:var(--rh-ink);box-shadow:0 6px 0 #1E8E81}
.node.now .dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--rh);opacity:.5;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.15);opacity:0}}
.node .nm{font-size:13px;text-align:center;line-height:1.3}
.node.locked .nm{color:var(--dim)}
.node .tag{font-family:var(--f-display);font-size:13px;background:var(--rh);color:var(--rh-ink);padding:1px 10px;border-radius:8px;margin-top:-2px}
.node.final .dot{width:92px;height:92px;font-size:20px}
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(2px 2px at 20% 30%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff5 50%,transparent 51%),radial-gradient(2px 2px at 35% 80%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 55% 45%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 10% 65%,#fff4 50%,transparent 51%)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:10px 0 12px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--rh)}

/* sheet */
.scrim{position:fixed;inset:0;background:#0009;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:85%;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>div{max-width:520px;margin:0 auto}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--bg3);border-radius:14px;padding:10px 12px}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-mono);font-size:13px}
.step.ok .n{background:var(--moon);color:var(--moon-ink)}
.step.lock{opacity:.45;cursor:not-allowed}
.step b{display:block;font-weight:600}

/* flow (full screen) */
.flow{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.flow-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(20px + env(safe-area-inset-bottom,0px))}
.fhead{display:grid;grid-template-columns:36px 1fr auto 36px;gap:12px;align-items:center}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg3);font-size:18px;line-height:1}
.prog{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rh);border-radius:5px;transition:width .3s}
.fgrow{flex:1;display:flex;flex-direction:column;gap:14px}
.lcard{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px 20px;font-size:17px;line-height:1.75;display:grid;gap:10px}
.lcard b{color:var(--moon);font-weight:600}
.lcard ul,.lcard ol{margin:0;padding-left:22px}
.lcard a{color:var(--rh)}
.fig{display:block;margin:10px auto 0;text-align:center;line-height:1.4}.fig svg{display:block;width:100%;height:auto;margin:0 auto;font-family:var(--f-body)}
.figcap{display:block;margin-top:6px;font-size:13px;color:var(--muted)}.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;align-items:end}.figrow>span{display:grid;gap:2px}.figrow .fig{margin:0}.figrow b{font-size:14px}
.kbd{font-family:var(--f-mono);background:var(--bg3);padding:0 6px;border-radius:5px;font-size:.88em}
.say{font-family:var(--f-display);font-size:24px;text-align:center;line-height:1.4}
.fb{text-align:center;min-height:26px;font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.stage-wrap{background:var(--stage);border-radius:16px;padding:10px;overflow-x:auto}
#bd{display:block;touch-action:none;border-radius:8px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:13px;color:var(--muted);min-height:20px}
.hud b{color:var(--ink)}
.result{display:grid;justify-items:center;gap:12px;text-align:center;padding-block:30px 10px}
.result .stars{font-size:56px;letter-spacing:8px}
.result h2{font-size:30px}
.jp{font-family:var(--f-mono);font-size:64px;line-height:1;position:relative;display:inline-block;padding:14px 6px}
.jp .dot{position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:currentColor}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px}
.answers button{background:var(--bg3);border-radius:12px;padding:12px 0;font-family:var(--f-mono);font-size:17px;box-shadow:0 3px 0 #0A0D22}
.qprompt{display:grid;place-items:center;min-height:130px;background:var(--bg2);border-radius:18px;padding:12px}
@media (orientation:portrait) and (max-height:700px){.qprompt{min-height:64px;padding:8px}.qz .say{font-size:20px}.flow-in,.fgrow{gap:10px}.qz .answers button{padding:9px 0}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.miclbl{font-size:12px;color:var(--muted);text-align:center;min-height:18px}

/* room / me */
select,input[type=number],input[type=text],textarea{font:inherit;background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{font-family:var(--f-mono);font-size:13px;min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--rh)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv b{display:block;font-family:var(--f-mono);font-size:22px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.week div{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:11px;color:var(--muted)}
.week i{width:70%;background:var(--rh);border-radius:5px 5px 2px 2px;min-height:3px}
.log{border-collapse:collapse;width:100%;font-size:13px}
.log th,.log td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
.log th{color:var(--muted);font-weight:500;border-top:0}
.ai-out{white-space:pre-wrap;background:var(--bg3);border-radius:12px;padding:12px;min-height:50px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--moon);color:var(--moon-ink);padding:10px 18px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-weight:600}

/* motion */
button{touch-action:manipulation}
.flow,.nav,.sheet,.node,#bd{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.node .dot{transition:transform .09s,box-shadow .09s}
.node:active .dot{transform:translateY(4px);box-shadow:0 2px 0 #070918}
.node.done:active .dot{box-shadow:0 2px 0 #B8902F} .node.now:active .dot{box-shadow:0 2px 0 #1E8E81}
.node .tag{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes starIn{0%{transform:scale(0) rotate(-50deg);opacity:0}70%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.08);opacity:.9}}
.flow.enter{animation:up .34s cubic-bezier(.2,.8,.2,1)}
.scrim{animation:fade .22s}
.sheet{animation:sheetIn .3s cubic-bezier(.2,.8,.2,1)}
.fb.pop{animation:pop .32s ease-out} .fb.shake{animation:shake .36s}
.result .stars{display:flex;justify-content:center;gap:6px;letter-spacing:0}
.result .stars .s{display:inline-block;opacity:0;animation:starIn .55s cubic-bezier(.3,1.5,.5,1) forwards}
.result .stars .s.off{color:var(--dim)}
.result .stars .s.on{text-shadow:0 0 18px rgba(255,211,110,.7)}
.result>*:not(.stars){animation:up .4s both}
.result.fail .stars{animation:shake .45s 1.1s}
.result .halo{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,211,110,.35),transparent 65%);animation:halo 2.4s ease-in-out infinite;z-index:-1;top:-30px}
.result{position:relative;isolation:isolate}
.reveal{animation:up .4s both}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.pl,.pl-main,.pl-side{display:grid;gap:14px;align-content:start}
@media (orientation:landscape) and (max-height:559px){
  .flow-in{max-width:none;gap:8px;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  .fhead{grid-template-columns:32px 1fr auto 32px}.x{width:32px;height:32px}
  .pl{grid-template-columns:1fr 200px;gap:12px}.pl-main,.pl-side{gap:8px}
  .pl-main>p{display:none}
  .stage-wrap{padding:6px}
  .pl-side .big{font-size:16px;padding:10px 12px}
  .pl-side .row{flex-wrap:wrap!important}.pl-side .row .big{width:100%!important}
  .fgrow{gap:8px}.say{font-size:19px}.qprompt{min-height:90px}
  .qz{display:grid;grid-template-columns:1fr 230px;align-content:start;column-gap:12px}.qz>*{grid-column:2}.qz>.stage-wrap{grid-column:1;grid-row:1/span 9;align-self:start}
  .qz .qprompt{min-height:0;padding:8px}.qz .answers{grid-template-columns:repeat(4,1fr);gap:6px}.qz .answers button{padding:8px 0}.lcard{padding:14px 18px;font-size:16px}
  .result{padding-block:6px}.result .stars{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.result .stars .s{opacity:1}}
</style>

<div class="sky"></div>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== 课程 ===================== */
const SONG_URL="https://www.youtube.com/watch?v=k8hSeXbKZRI";
const SHEET_URL="http://www.gangqinpu.com/html/1000679.htm";
const WORLDS=[
  {n:"第一章 · 认识琴键",d:"认键、拍子、看谱",lv:[1,2,3]},
  {n:"第二章 · 右手旋律",d:"音阶、节奏、黑键",lv:[4,5,6]},
  {n:"第三章 · 左手与和弦",d:"低音、三和弦、双手",lv:[7,8,9]},
  {n:"第四章 · 流行伴奏",d:"和弦进行、DJ 律动、踏板",lv:[10,11,12]},
  {n:"终章 · 失眠的夜",d:"拿谱、分手、合手、演出",lv:[13,14,15]},
];
const arp=(r,f,o,times=1)=>(`${r}:0.5 ${f}:0.5 ${o}:0.5 ${f}:0.5 `).repeat(2*times);
const djL=(oct,n=4)=>(`${oct}:1 `).repeat(n);
const djR=(ch,n=4)=>(`0:0.5 ${ch}:0.5 `).repeat(n);
/* ===== 讲解卡片用的小图（SVG） ===== */
const FC={rh:"#3DDBC8",lh:"#B79BFF",moon:"#FFD36E",dim:"#5C6390",ink:"#EEF0FF",mu:"#9BA1CB"};
const figWrap=(svg,cap)=>`<span class="fig">${svg}${cap?`<span class="figcap">${cap}</span>`:""}</span>`;
const isBlk=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
// lo..hi 必须是白键；marks {midi:"标签"} 或 {midi:{t,c}}；o.top=[[m1,m2,"文字"]] 画在上方的括号；o.names 白键都写音名
function kb(lo,hi,marks={},o={}){
  const ww=24,wh=86,bw=15,bh=54, whites=[]; for(let m=lo;m<=hi;m++) if(!isBlk(m)) whites.push(m);
  const W=whites.length*ww, hasBl=Object.keys(marks).some(k=>isBlk(+k)), top=(o.top?.length?26:0)+(hasBl?16:0), H=top+wh+2;
  const mk=m=>{const v=marks[m]; return v==null?null:typeof v==="object"?v:{t:v};};
  const cx=m=>isBlk(m)?(whites.indexOf(m-1)+1)*ww:whites.indexOf(m)*ww+ww/2;
  let s=`<svg viewBox="-1 0 ${W+2} ${H}" style="max-width:${Math.min(W*1.5,460)}px" role="img" aria-label="琴键示意图">`;
  whites.forEach((m,i)=>{const k=mk(m), c=k?FC[k.c||o.c||"rh"]:"#F8F6EE";
    s+=`<rect x="${i*ww+.5}" y="${top}" width="${ww-1}" height="${wh}" rx="3" fill="${c}" stroke="#20253F"/>`;
    const t=k?.t??(o.names?"CDEFGAB"["024579B".indexOf("0123456789AB"[m%12])]:"");
    if(t!=="") s+=`<text x="${i*ww+ww/2}" y="${top+wh-9}" text-anchor="middle" font-size="${String(t).length>2?9:12}" font-weight="700" fill="${k?"#0B0E1F":"#6A6F8E"}">${t}</text>`;
  });
  for(let m=lo;m<=hi;m++) if(isBlk(m)&&m>lo){const k=mk(m), x=cx(m)-bw/2;
    s+=`<rect x="${x}" y="${top}" width="${bw}" height="${bh}" rx="2" fill="${k?FC[k.c||o.c||"rh"]:"#151826"}"/>`;
    if(k) s+=`<text x="${x+bw/2}" y="${top-4}" text-anchor="middle" font-size="10" font-weight="700" fill="${FC[k.c||o.c||"rh"]}">${k.t}</text>`;}
  (o.top||[]).forEach(([a,b,t])=>{const x1=cx(a),x2=cx(b),y=20;
    s+=`<path d="M${x1} ${y+6}V${y}H${x2}V${y+6}" fill="none" stroke="${FC.moon}" stroke-width="1.5"/><text x="${(x1+x2)/2}" y="${y-5}" text-anchor="middle" font-size="10" fill="${FC.moon}">${t}</text>`;});
  return figWrap(s+"</svg>",o.cap);
}
// 节奏格：rows=[{n:"名字",v:[长度 或 [长度,文字,透明度]]}]，一行 4 拍；透明度 0 = 空（休止/不弹）
function beats(rows,cap,o={}){
  const bw=56,lw=o.lw??64,rh=30,W=lw+4*bw,H=18+rows.length*(rh+8);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="max-width:${W*1.3}px" role="img" aria-label="节奏示意图">`;
  for(let i=0;i<4;i++) s+=`<text x="${lw+i*bw+4}" y="12" font-size="11" fill="${FC.mu}">${i+1}</text>`;
  for(let i=0;i<=4;i++) s+=`<line x1="${lw+i*bw}" x2="${lw+i*bw}" y1="15" y2="${H}" stroke="#2A3060" stroke-width="${i%4?1:2}"/>`;
  rows.forEach((r,j)=>{const y=18+j*(rh+8); let x=lw;
    s+=`<text x="0" y="${y+rh/2+4}" font-size="12" fill="${FC.ink}">${r.n}</text>`;
    r.v.forEach(e=>{const [l,t,a]=Array.isArray(e)?e:[e]; const w=l*bw;
      if(a===0){ if(t) s+=`<text x="${x+w/2}" y="${y+rh/2+4}" text-anchor="middle" font-size="11" fill="${FC.dim}">${t}</text>`; }
      else if(l<0){ s+=`<rect x="${x-l*bw*0+2}" y="${y+2}" width="${-w-4}" height="${rh-4}" rx="6" fill="none" stroke="${FC.dim}" stroke-dasharray="4 3"/><text x="${x-w/2}" y="${y+rh/2+4}" text-anchor="middle" font-size="11" fill="${FC.mu}">${t??"休"}</text>`; x-=w; return; }
      else s+=`<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${rh-4}" rx="6" fill="${r.c?FC[r.c]:FC.rh}" opacity="${a??1}"/>${t?`<text x="${x+w/2}" y="${y+rh/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0E1F">${t}</text>`:""}`;
      x+=w;});
  });
  return figWrap(s+"</svg>",cap);
}
// 五线谱上一串上行的音，线上的音黄色、间里的音青色，下面写音名
function staffRow(clef,cap){
  const tr=clef==="treble", base=tr?30:18, from=tr?28:18, to=tr?38:30, gap=12, bottom=82, x0=58, dx=20;
  const W=x0+(to-from+1)*dx+10, H=118; let s=`<svg viewBox="0 0 ${W} ${H}" style="max-width:${W*1.3}px" role="img" aria-label="${tr?"高音":"低音"}谱号的线和间">`;
  for(let i=0;i<5;i++) s+=`<line x1="4" x2="${W-4}" y1="${bottom-i*gap}" y2="${bottom-i*gap}" stroke="${FC.ink}" stroke-width="1"/>`;
  s+=tr?`<text x="6" y="${bottom+10}" font-size="58" font-family="'Noto Music',serif" fill="${FC.ink}">𝄞</text>`:`<text x="8" y="${bottom-20}" font-size="40" font-family="'Noto Music',serif" fill="${FC.ink}">𝄢</text>`;
  for(let idx=from,i=0;idx<=to;idx++,i++){const x=x0+i*dx, y=bottom-(idx-base)*gap/2, line=(idx-base)%2===0, c=line?FC.moon:FC.rh;
    if(idx<base&&line||idx>base+8&&line) s+=`<line x1="${x-11}" x2="${x+11}" y1="${y}" y2="${y}" stroke="${FC.ink}"/>`;
    s+=`<ellipse cx="${x}" cy="${y}" rx="7" ry="5.2" transform="rotate(-20 ${x} ${y})" fill="${c}"/><text x="${x}" y="${H-4}" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">${"CDEFGAB"[((idx%7)+7)%7]}</text>`;}
  return figWrap(s+"</svg>",cap);
}

function hands(){

    const tx=X(ox,30); s+=`<rect x="${tx}" y="74" width="30" height="18" rx="9" fill="#1C2247" stroke="${FC.mu}"/><text x="${tx+(left?20:10)}" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="${FC.moon}">1</text>`;
    return s+`<text x="${ox+65}" y="128" text-anchor="middle" font-size="12" fill="${FC.mu}">${left?"左手":"右手"}</text>`;};
  return figWrap(`<svg viewBox="0 0 290 134" style="max-width:360px" role="img" aria-label="手指编号：大拇指是 1，小指是 5">${one(0,true)}${one(155,false)}</svg>`,"两只手都是大拇指 = 1，小指 = 5（手心朝下看）");
}

1:{t:"琴键地图",goal:"闭着眼也能找到任何一个 C，右手放在 C 五指位置弹出《欢乐颂》。",
 lesson:`<p><b>黑键是路标。</b>黑键 2 个一组、3 个一组交替排列。<b>2 个黑键左边那个白键就是 C</b>，往右依次是 D E F G A B，然后又回到 C。从一个 C 到下一个 C 叫做<b>一个八度</b>。${kb(48,72,{48:{t:"C",c:"moon"},60:{t:"C",c:"moon"},72:{t:"C",c:"moon"}},{names:true,top:[[49,51,"2 个黑键"],[54,58,"3 个黑键"],[61,63,"2 个"],[66,70,"3 个"]],cap:"黄色都是 C：在 2 个黑键的左边。C 到下一个 C = 一个八度"})}</p>
<p><b>中央 C（C4）</b>是离琴中间最近的 C。电子琴 61 键版一般有 5 个 C，从左往右叫 C2 C3 C4 C5 C6，数字越大音越高。练琴房里的键上都标了名字。${kb(36,84,{36:{t:"C2",c:"dim"},48:{t:"C3",c:"dim"},60:{t:"C4",c:"moon"},72:{t:"C5",c:"dim"},84:{t:"C6",c:"dim"}},{cap:"黄色的 C4 就是中央 C，在琴的中间"})}</p>
<p><b>手指编号：</b>两只手都是大拇指 = 1，食指 = 2，中指 = 3，无名指 = 4，小指 = 5。谱上写的小数字就是用哪根手指。${hands()}</p>
<p><b>C 五指位置：</b>右手 1 指放 C4，2 指 D，3 指 E，4 指 F，5 指 G。每根手指管一个键，不用看手也知道按的是什么。${kb(60,72,{60:"1",62:"2",64:"3",65:"4",67:"5"},{cap:"右手 C 五指位置：键上的数字 = 用哪根手指"})}</p>
<p><b>坐姿与手型：</b>坐在琴凳前半部分，手肘和琴键差不多高，手像轻轻握着一个鸡蛋，用指尖按键，手腕放松不要塌。</p>
<p class="muted small">你以前跟着视频"看哪里亮就按哪里"，那是在模仿。从今天起换成"知道自己在按什么"：先叫得出键名，再按下去。</p>`,

2:{t:"节拍与节奏",goal:"跟着节拍器稳定数拍，弹完整首《小星星》不赶不拖。",

<div><ul><li><b>四分音符</b> = 1 拍（数"1"）</li><li><b>二分音符</b> = 2 拍（数"1 2"）</li><li><b>全音符</b> = 4 拍（数"1 2 3 4"）</li><li><b>休止符</b> = 不弹，但拍子照数</li></ul>${beats([{n:"四分",v:[1,1,1,1]},{n:"二分",v:[2,2]},{n:"全音符",v:[4]},{n:"休止符",v:[1,-1,1,-1]}],"方块越长，按住越久；虚线框 = 不弹，但心里照样数")}</div>
<p><b>练法：</b>先只拍手、嘴里数"1 2 3 4"，再上琴。按键的瞬间要和"嗒"一起，音要按满时值再抬手，别弹完就跑。</p>

3:{t:"看懂乐谱",goal:"认得简谱和五线谱高音谱号上的音，看谱弹出《两只老虎》。",
 lesson:`<p>《失眠的夜》的谱（虫虫钢琴）通常有<b>简谱</b>和<b>五线谱</b>两种，两种都要会看。</p>
<p><b>简谱（1=C 时）：</b>1 2 3 4 5 6 7 = C D E F G A B（do re mi fa sol la si）。数字<b>上面加点</b>高八度（C5），<b>下面加点</b>低八度（C3）。数字后面的 <span class="kbd">-</span> 表示多拉 1 拍；数字<b>下面一条横线</b>是半拍，两条是 1/4 拍；<b>右边一个点</b>（附点）表示加长一半。${kb(48,72,{48:{t:"1",c:"lh"},50:{t:"2",c:"lh"},52:{t:"3",c:"lh"},53:{t:"4",c:"lh"},55:{t:"5",c:"lh"},57:{t:"6",c:"lh"},59:{t:"7",c:"lh"},60:"1",62:"2",64:"3",65:"4",67:"5",69:"6",71:"7",72:{t:"1",c:"moon"}},{cap:"青色 C4–B4 = 1 2 3 4 5 6 7（中音）<br>紫色 = 数字下面加点（低八度），黄色 = 上面加点（高八度）"})}</p>
<p><b>"1=G"、"1=D" 是什么：</b>表示 1 从哪个键开始。比如 1=G 时，1 就是 G，其他音跟着平移。第 6 关会讲。</p>
<p><b>五线谱高音谱号（右手）：</b>五条线从下往上是 <b>E G B D F</b>，四个间从下往上是 <b>F A C E</b>。中央 C 在五线下方，要加一条短线。${staffRow("treble","黄色音在线上（E G B D F），青色音在间里（F A C E）；最左边带短线的是中央 C")}</p>
<p><b>五线谱低音谱号（左手）：</b>线是 <b>G B D F A</b>，间是 <b>A C E G</b>。第 7 关再细练。${staffRow("bass","黄色在线上（G B D F A），青色在间里（A C E G）；最右边带短线的是中央 C")}</p>

4:{t:"音阶与穿指",goal:"右手用正确指法弹 C 大调音阶，上下行连贯、不断音。",
 lesson:`<p>五个手指只能管 5 个键。旋律一超出范围，就要<b>穿指</b>和<b>跨指</b>。这是钢琴最核心的技术之一。</p>
<p><b>C 大调音阶右手指法：</b>上行 <span class="kbd">1 2 3 | 1 2 3 4 5</span>：弹完 E（3 指）后，<b>大拇指从手掌下面穿过去</b>按 F。下行 <span class="kbd">5 4 3 2 1 | 3 2 1</span>：弹完 F（1 指）后，<b>3 指从大拇指上面跨过去</b>按 E。${kb(60,72,{60:"1",62:"2",64:"3",65:{t:"1",c:"moon"},67:"2",69:"3",71:"4",72:"5"},{top:[[64,65,"拇指从下面穿过去"]],cap:"上行：1 2 3 弹完 E，黄色的 F 用大拇指"})}</p>

5:{t:"八分音符与切分",goal:"弹准半拍、附点和切分。这些是 DJ 版律动感的来源。",
 lesson:`<p><b>八分音符</b> = 半拍，一拍里弹两个。数法："<b>1</b> 嗯 <b>2</b> 嗯"，嘴里说"1 &amp; 2 &amp;"。${beats([{n:"四分",v:[[1,"1"],[1,"2"],[1,"3"],[1,"4"]]},{n:"八分",v:[[.5,"1"],[.5,"&"],[.5,"2"],[.5,"&"],[.5,"3"],[.5,"&"],[.5,"4"],[.5,"&"]]}],"八分音符：一拍里弹两个")}</p>
<p><b>附点四分音符</b> = 1.5 拍，常和半拍组合："哒——嗒"（长 短）。${beats([{n:"附点",v:[[1.5,"哒——"],[.5,"嗒"],[1.5,"哒——"],[.5,"嗒"]]}],"附点四分 1.5 拍 + 八分 0.5 拍 = 2 拍")}</p>
<p><b>切分音：</b>重音落在弱拍或拍子中间，比如"短 长 短"（半拍 1拍 半拍）。流行歌和 DJ 版那种"往前推"的感觉，大部分来自切分。${beats([{n:"切分",v:[[.5,"短"],[1,"长"],[.5,"短"],[.5,"短"],[1,"长"],[.5,"短"]]}],"“长”的音从拍子中间开始，所以有往前推的感觉")}</p>

6:{t:"黑键与调",goal:"认得所有黑键名字，会弹 G 大调和 F 大调，知道怎么用电子琴的移调键。",
 lesson:`<p><b>半音与全音：</b>相邻两个键（包括黑键）差一个<b>半音</b>，隔一个键是<b>全音</b>。E-F、B-C 之间没有黑键，本来就是半音。${kb(60,72,{64:{t:"E",c:"moon"},65:{t:"F",c:"moon"},71:{t:"B",c:"moon"},72:{t:"C",c:"moon"}},{names:true,top:[[60,61,"半音"],[64,65,"半音"],[67,69,"全音"],[71,72,"半音"]],cap:"E-F、B-C 中间没有黑键，本来就只差半音"})}</p>
<p><b>升号 #</b> = 升高半音（往右一个键），<b>降号 b</b> = 降低半音（往左一个键）。所以 C# 和 Db 是同一个黑键。${kb(60,64,{60:"C",61:{t:"C# = Db",c:"moon"},62:"D"},{cap:"C 往右一个键 = C#，D 往左一个键 = Db，是同一个黑键"})}</p>
<p><b>大调音阶公式：</b>全 全 半 全 全 全 半。从 C 开始正好全是白键；从 G 开始要把 F 换成 <b>F#</b>；从 F 开始要把 B 换成 <b>Bb</b>。${kb(60,72,{60:"C",62:"D",64:"E",65:"F",67:"G",69:"A",71:"B",72:"C"},{top:[[60,62,"全"],[62,64,"全"],[64,65,"半"],[65,67,"全"],[67,69,"全"],[69,71,"全"],[71,72,"半"]]})}${kb(67,79,{67:"G",69:"A",71:"B",72:"C",74:"D",76:"E",78:{t:"F#",c:"moon"},79:"G"},{cap:"同一个公式从 G 开始，第 7 个音要用黑键 F#"})}</p>
<p><b>调号：</b>谱子开头写的 # 或 b，表示整首歌这些音都要升或降。简谱"1=G"就是 G 大调。</p>
<p><b>电子琴的 Transpose（移调）键：</b>如果谱子的调太难（很多黑键），可以把琴移调，用 C 调指法弹出原调的声音。先查一下你的琴有没有这个键。不过真正的钢琴手两种都要会。</p>`,
 ex:[{n:"G 大调音阶",bpm:60,rh:"G A B C5 D5 E5 F#5 G5:2 | F#5 E5 D5 C5 B4 A4 G4:2",tip:"指法同 C 大调：1 2 3 1 2 3 4 5"},
     {n:"F 大调五指",bpm:66,rh:"F G A Bb C5 Bb A G | F:4"},
     {n:"半音阶散步",bpm:60,rh:"C C# D D# E F F# G | G F# F E D# D C# C:2"}],
 quiz:"black",
 boss:{t:"黑键行者",c:["小测验「黑键」模式 9 分以上","G 大调音阶等待模式准确率 90% 以上","在电子琴上找到移调（Transpose）功能，并试着把《小星星》移到 G 调弹（从 G 开始）"]}},
7:{t:"唤醒左手",goal:"左手独立弹低音，读得懂低音谱号。",
 lesson:`<p>左手是伴奏的地基。DJ 版里左手负责低音和律动，比右手还忙。</p>
<p><b>左手 C 五指位置：</b>小指（5）放 C3，4 指 D，3 指 E，2 指 F，大拇指（1）G。注意<b>编号方向和右手相反</b>。${kb(48,55,{48:"5",50:"4",52:"3",53:"2",55:"1"},{c:"lh",cap:"左手：小指在 C3，大拇指在 G3（和右手方向相反）"})}</p>
<p><b>低音谱号：</b>线从下往上 <b>G B D F A</b>，间 <b>A C E G</b>。中央 C 在低音谱表上方加一线。${staffRow("bass","黄色在线上（G B D F A），青色在间里（A C E G）")}</p>
<p><b>根音：</b>每个和弦最低的那个"名字音"。比如 C 和弦的根音是 C。流行伴奏最简单的弹法，就是左手只弹根音。</p>
<p class="muted small">"左手根音"练习里的 C → G → A → F，就是第 10 关要学的流行万能和弦进行，先把它的低音弹熟。</p>`,
 ex:[{n:"左手五指上下行",bpm:60,lh:"C3 D3 E3 F3 G3 F3 E3 D3 C3:4"},
     {n:"左手根音（流行进行）",bpm:72,lh:"C3:4 G2:4 A2:4 F2:4 C3:4 G2:4 A2:4 F2:4"},
     {n:"左手八度",bpm:66,lh:"C2+C3:4 G2+G3:4 A2+A3:4 F2+F3:4",tip:"小指 + 大拇指同时按两个 C，手张开一个八度。手小的话先只弹上面那个音"}],
 quiz:"white",
 boss:{t:"左手觉醒",c:["左手五指上下行在电子琴上不看手弹完","「左手根音」等待模式准确率 90% 以上","左手八度 C-G-A-F 跟节拍器 72 弹 4 轮"]}},
8:{t:"三和弦",goal:"10 秒内按出 C、Dm、Em、F、G、Am 六个和弦。",
 lesson:`<p><b>三和弦</b> = 根音 + 隔一个音 + 再隔一个音。在白键上就是"<b>按一个、跳一个、按一个、跳一个、按一个</b>"。${kb(60,72,{60:"按",62:{t:"跳",c:"dim"},64:"按",65:{t:"跳",c:"dim"},67:"按"},{cap:"C 和弦：按 C、跳过 D、按 E、跳过 F、按 G"})}</p>
<p><b>大三和弦</b>（明亮）：根音往上 4 个半音 + 3 个半音。C = C E G，F = F A C，G = G B D。${kb(60,67,{60:"C",64:"E",67:"G"},{top:[[60,64,"4 个半音"],[64,67,"3 个半音"]],cap:"C 大三和弦：明亮"})}</p>
<p><b>小三和弦</b>（忧伤，写作 m）：3 + 4 个半音。Am = A C E，Dm = D F A，Em = E G B。${kb(57,64,{57:"A",60:"C",64:"E"},{c:"lh",top:[[57,60,"3 个半音"],[60,64,"4 个半音"]],cap:"Am 小三和弦：忧伤"})}</p>
<p>C 大调里这 6 个和弦能伴奏绝大部分流行歌。《失眠的夜》这种伤感情歌，<b>Am 常常是主角</b>。</p>
<p><b>手型：</b>右手用 1-3-5 指，左手用 5-3-1 指。三个音必须同时落下、一样响。</p>`,
 ex:[{n:"右手和弦 C F G C",bpm:60,rh:"C4+E4+G4:4 F4+A4+C5:4 G4+B4+D5:4 C5+E5+G5:4"},
     {n:"左手和弦 C Am F G",bpm:60,lh:"C3+E3+G3:4 A2+C3+E3:4 F2+A2+C3:4 G2+B2+D3:4"},
     {n:"六个和弦巡游",bpm:60,rh:"C4+E4+G4:2 D4+F4+A4:2 E4+G4+B4:2 F4+A4+C5:2 G4+B4+D5:2 A4+C5+E5:2 C5+E5+G5:4"}],
 quiz:"chord",
 boss:{t:"和弦收藏家",c:["小测验「和弦」模式 8 分以上","电子琴上，听别人（或自己随机）报和弦名，3 秒内按出","左手和弦 C Am F G 跟节拍器 72 弹 4 轮不停"]}},
9:{t:"双手合作",goal:"右手旋律 + 左手低音，双手一起弹完两首曲子。",
 lesson:`<p>双手一起是新手最大的坎。秘诀只有一个：<b>先分手，再合手，合手先极慢。</b></p>
<ol><li>右手单独弹熟（不看谱也能弹）</li><li>左手单独弹熟</li><li>合手用 50% 速度，<b>只盯左手换音的那一拍</b>，那一拍两手同时落下</li><li>每次提速 10%</li></ol>
<p>练琴房里选"只练右手"或"只练左手"，另一只手由电脑弹给你听。这就是分手练习的好帮手。</p>
<p class="muted small">合手时脑子会乱，正常现象。大脑需要几天把动作"自动化"，睡一觉常常就会了。</p>`,
 ex:[{n:"欢乐颂（双手）",bpm:66,rh:"E E F G | G F E D | C C D E | E:1.5 D:0.5 D:2 | E E F G | G F E D | C C D E | D:1.5 C:0.5 C:2",lh:"C3:4 G2:4 C3:4 G2:4 C3:4 G2:4 C3:4 G2:2 C3:2"},
     {n:"小星星（双手）",bpm:66,rh:"C C G G | A A G:2 | F F E E | D D C:2",lh:"C3:4 F3:2 C3:2 F3:2 C3:2 G2:2 C3:2"},
     {n:"小星星（左手和弦）",bpm:60,rh:"C C G G | A A G:2 | F F E E | D D C:2",lh:"C3+E3+G3:4 F3+A3+C4:2 C3+E3+G3:2 F3+A3+C4:2 C3+E3+G3:2 G2+B2+D3:2 C3+E3+G3:2"}],
 quiz:"chord",
 boss:{t:"双手觉醒",c:["欢乐颂（双手）等待模式「双手都练」准确率 85% 以上","电子琴上双手弹《欢乐颂》80 BPM 不停","小星星（左手和弦）在电子琴上弹完"]}},
10:{t:"流行和弦进行",goal:"熟练弹出 1-5-6-4、6-4-1-5、4-5-3-6 三条流行和弦进行。",
 lesson:`<p>流行歌的和弦大多按固定套路走，用数字表示（C 调里 1=C，4=F，5=G，6m=Am，3m=Em）：</p>
<div><ul><li><b>1-5-6-4</b>（C G Am F）：万能进行，听起来很"歌"</li><li><b>6-4-1-5</b>（Am F C G）：伤感版，很多抖音热歌都是它</li><li><b>4-5-3-6</b>（F G Em Am）：华语抒情"王道进行"</li></ul>${chordRow([["C",[60,64,67],"rh"],["G",[59,62,67],"rh"],["Am",[57,60,64],"lh"],["F",[57,60,65],"rh"]],"1-5-6-4 右手就近的按法：几乎不用移动手")}</div>
<p><b>转位：</b>同一个和弦的三个音可以换顺序。G 和弦弹 B D G（而不是 G B D），手就不用跳那么远，和弦连起来更顺。练习里右手用的都是"就近"的转位。${chordRow([["G：G B D",[55,59,62],"rh"],["G：B D G",[59,62,67],"moon"]],"同样是 G 和弦，右边的按法离 C 和弦更近")}</p>
<p><b>听歌找和弦：</b>播放《失眠的夜》，一边听一边在琴上按 Am、F、C、G，哪个和弦和歌"融在一起"，就是那一段的和弦。</p>`,
 ex:[{n:"1-5-6-4（C G Am F）",bpm:72,rh:"C4+E4+G4:4 B3+D4+G4:4 A3+C4+E4:4 A3+C4+F4:4",lh:"C3:4 G2:4 A2:4 F2:4"},
     {n:"6-4-1-5（Am F C G）",bpm:72,rh:"A3+C4+E4:4 A3+C4+F4:4 G3+C4+E4:4 G3+B3+D4:4",lh:"A2:4 F2:4 C3:4 G2:4"},
     {n:"4-5-3-6 王道进行",bpm:72,rh:"A3+C4+F4:4 B3+D4+G4:4 B3+E4+G4:4 A3+C4+E4:4",lh:"F2:4 G2:4 E2:4 A2:4"}],
 quiz:"chord",
 boss:{t:"和弦行者",c:["三条进行在电子琴上双手各弹 4 轮，换和弦不停顿","不看谱，凭记忆弹出 6-4-1-5","用耳朵在《失眠的夜》里找出至少一段的和弦，写进「我的曲谱」备注"]}},
11:{t:"分解和弦与 DJ 律动",goal:"左手会两种伴奏型：抒情的分解和弦、DJ 版的八度律动。",
 lesson:`<p><b>分解和弦 1-5-8-5：</b>不把和弦一起按下，而是按"根音、五音、高八度根音、五音"一个个弹，一拍两个。抒情钢琴最常用。左手指法：5 - 2 - 1 - 2。${kb(48,60,{48:"①",55:"②④",60:"③"},{c:"lh",cap:"按 ① ② ③ ④ 的顺序：C3 → G3 → C4 → G3"})}${beats([{n:"左手",v:[[.5,"1"],[.5,"5"],[.5,"8"],[.5,"5"],[.5,"1"],[.5,"5"],[.5,"8"],[.5,"5"]],c:"lh"}],"一拍两个音")}</p>
<p><b>DJ 八度律动：</b>左手在每一拍上弹八度（"动"），右手在拍子中间弹和弦（"次"），连起来就是"动 次 动 次"。这是 DJ 热搜版的骨架。${beats([{n:"左手",v:[[.5,"动"],[.5,"",0],[.5,"动"],[.5,"",0],[.5,"动"],[.5,"",0],[.5,"动"],[.5,"",0]],c:"lh"},{n:"右手",v:[[.5,"",0],[.5,"次"],[.5,"",0],[.5,"次"],[.5,"",0],[.5,"次"],[.5,"",0],[.5,"次"]]}],"左手在拍子上，右手在拍子中间")}</p>
<p><b>要点：</b>左手要像鼓一样稳，节奏比音准更重要。DJ 版速度快，先 60 BPM 练稳再一点点加。</p>`,
 ex:[{n:"分解和弦 C G Am F",bpm:66,rh:"E5:4 D5:4 C5:4 C5:4",lh:arp("C3","G3","C4")+arp("G2","D3","G3")+arp("A2","E3","A3")+arp("F2","C3","F3")},
     {n:"DJ 动次律动（Am F C G）",bpm:80,rh:djR("A4+C5+E5")+djR("A4+C5+F5")+djR("G4+C5+E5")+djR("G4+B4+D5"),lh:djL("A2+A3")+djL("F2+F3")+djL("C2+C3")+djL("G2+G3")},
     {n:"DJ 律动 + 切分低音",bpm:84,rh:djR("A4+C5+E5")+djR("A4+C5+F5"),lh:"A2+A3:1.5 A2+A3:0.5 0:1 A2+A3:1 | F2+F3:1.5 F2+F3:0.5 0:1 F2+F3:1"}],
 quiz:"chord",
 boss:{t:"律动制造机",c:["分解和弦 C G Am F 在电子琴上 72 BPM 弹 4 轮","「DJ 动次律动」等待模式双手准确率 85% 以上","电子琴上用 DJ 律动弹 6-4-1-5，100 BPM 坚持 1 分钟"]}},
12:{t:"踏板、力度与表现",goal:"会用延音，弹出强弱变化。原创小曲双手完整演奏。",
 lesson:`<p><b>延音踏板 / Sustain：</b>踩下后抬手声音也不断，和弦会连成一片。电子琴如果没接踏板，面板上一般有 Sustain 按钮。<b>换和弦时要"抬一下再踩"</b>，否则声音会糊。${pedalFig()}</p>
<p><b>力度：</b>电子琴开了 Touch Response（力度感应）后，按得重声音就大。p = 弱，mf = 中强，f = 强。主歌轻、副歌强，歌曲就有了起伏。</p>
<p><b>旋律要比伴奏响：</b>右手旋律稍重，左手伴奏轻一点，这样听起来更像在"唱"。</p>
<p class="muted small">这一关的原创小曲用到了前面所有技能：音阶、八分音符、附点、和弦进行、左手分解。弹完它，你就具备弹《失眠的夜》的全部基本功了。</p>`,
 ex:[{n:"原创小曲《夜行》",bpm:66,rh:"E G C5:1.5 B:0.5 | D5:2 B G | C5 B:0.5 A:0.5 E:2 | F A C5 D5 | E5:1.5 D5:0.5 C5 G | B:1.5 A:0.5 G:2 | A C5 E5 D5 | C5:2 B:2 | C5:4",
      lh:arp("C3","G3","C4")+arp("G2","D3","G3")+arp("A2","E3","A3")+arp("F2","C3","F3")+arp("C3","G3","C4")+arp("G2","D3","G3")+arp("A2","E3","A3")+arp("F2","C3","F3")+"C3+G3+C4:4"},
     {n:"强弱对比练习",bpm:66,rh:"C4+E4+G4:2 C4+E4+G4:2 F4+A4+C5:2 F4+A4+C5:2 | G4+B4+D5:2 G4+B4+D5:2 C5+E5+G5:4",tip:"前两小节弹 p（轻），后两小节弹 f（强），注意整个和弦一起变"}],
 quiz:"staff",
 boss:{t:"小小演奏家",c:["《夜行》双手等待模式准确率 85% 以上","电子琴上带延音完整弹《夜行》，换和弦不糊","录下自己弹的《夜行》，听回来有强弱起伏"]}},
13:{t:"拿到谱、拆开曲子",goal:"拿到《失眠的夜》的谱（或自己扒谱），分好段，把第一段写进「我的曲谱」。",
 lesson:`<p><b>第一步：拿谱。</b>视频作者 Cuppix 在说明里给了谱的链接：<a href="${SHEET_URL}" target="_blank" rel="noopener">虫虫钢琴 · 失眠的夜</a>（可能要注册或付费）。有正谱最好，跟视频完全对得上。</p>
<p><b>没有谱就扒谱：</b>打开<a href="${SONG_URL}" target="_blank" rel="noopener">原视频</a>，设置 → 播放速度 0.5，每 2–3 秒暂停一次，看下落方块落在哪个键，记下键名。你已经认识所有的键了，这一步会比以前快很多。</p>
<p><b>第二步：分段。</b>流行歌一般是：<b>前奏 → 主歌 → 副歌 → 间奏 → 主歌 → 副歌 → 尾奏</b>。副歌（最好听、最"上头"的那段）往往会重复，<b>先练副歌</b>，最有成就感。</p>
<p><b>第三步：看调。</b>谱子开头写的"1=?"或者调号，告诉你黑键用哪几个（第 6 关）。</p>
<p><b>第四步：写进「我的曲谱」。</b>在底部「练琴房」页的「我的曲谱」里，用 <span class="kbd">C D E:2 A3+C4+E4:4</span> 这种写法录入。看不懂怎么写，就把简谱贴给 AI 教练，选"简谱转练琴格式"，它帮你转。</p>`,
 ex:[], quiz:"jianpu", useSong:true,
 boss:{t:"扒谱者",c:["拿到谱，或者已经扒出副歌右手旋律","把整首曲子分好段（前奏/主歌/副歌…）写在曲谱备注里","副歌右手已经录进「我的曲谱」，练琴房能播放，听起来和原曲一样"]}},
14:{t:"分手攻克全曲",goal:"右手旋律、左手伴奏分别能弹完整首。",
 lesson:`<p><b>一段一段来，每天只啃一小段（4–8 小节）。</b>顺序：副歌 → 主歌 → 前奏/间奏 → 尾奏。</p>
<p><b>右手：</b>先定指法（谱上没写就自己用铅笔标），难的地方单独拎出来练 5 遍。用练琴房"只练右手"的等待模式，从 50% 速度开始。</p>
<p><b>左手：</b>DJ 版的左手大多是第 11 关的八度律动和切分低音。先只弹根音找和弦，再加八度和节奏。</p>
<p><b>卡住怎么办：</b>把卡住的 2 个音单独循环 10 遍，再往前加 1 个音、往后加 1 个音。别从头开始弹，从头弹只会让开头越来越熟、后面越来越生。</p>
<p class="muted small">一天练不完很正常，一段一段攻下来，不用急。</p>`,
 ex:[], quiz:"black", useSong:true,
 boss:{t:"分手通关",c:["右手全曲录入「我的曲谱」，等待模式只练右手准确率 90%","左手全曲录入「我的曲谱」，等待模式只练左手准确率 90%","电子琴上右手单独弹完全曲（可以看谱）","电子琴上左手单独弹完全曲（可以看谱）"]}},
15:{t:"失眠的夜 · 终极演出",goal:"双手完整弹出《失眠的夜》，录下来。",

// 写法：C D# Bb3 E:2 0:1 C3+E3+G3:4  （默认右手第 4 八度、左手第 3 八度；0 = 休止；| 只是小节线）
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const nameOf=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
function n2m(tok,defOct){
  const m=/^([A-G])([#b]?)(\d)?$/.exec(tok); if(!m) return null;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return 12*((m[3]!=null?+m[3]:defOct)+1)+base+(m[2]==="#"?1:m[2]==="b"?-1:0);
}
function parseVoice(str,h,defOct){
  const notes=[],errs=[]; let t=0;
  for(const raw of (str||"").replace(/[|｜]/g," ").split(/\s+/)){
    if(!raw) continue;
    const [p,ds]=raw.split(/[:：]/); const d=ds==null?1:parseFloat(ds);
    if(!(d>0)){errs.push(raw);continue;}
    if(p==="0"||p==="-"){t+=d;continue;}
    const ms=p.split("+").map(x=>n2m(x,defOct));
    if(ms.some(x=>x==null)){errs.push(raw);t+=d;continue;}
    for(const m of ms) notes.push({m,s:t,d,h});
    t+=d;
  }
  return {notes,len:t,errs};
}
function compile(ex){
  const r=parseVoice(ex.rh,"r",4), l=parseVoice(ex.lh,"l",3);
  const notes=[...r.notes,...l.notes].sort((a,b)=>a.s-b.s||a.m-b.m);
  return {notes,len:Math.max(r.len,l.len),errs:[...r.errs,...l.errs]};
}
const songNotes=()=>compile(S.song).notes;

let AC=null, master=null;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createDynamicsCompressor();const g=AC.createGain();g.gain.value=.7;master.connect(g);g.connect(AC.destination);}
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function tone(m,dur=.5,vel=.8,when=0){
  const a=ac(), t0=a.currentTime+when, f=440*2**((m-69)/12), end=t0+Math.max(dur,.12);
  const g=a.createGain(), peak=.32*vel*(m<48?1.25:1);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(peak,t0+.006);
  g.gain.setTargetAtTime(peak*.25,t0+.006,.35); g.gain.setTargetAtTime(0,end,.07);
  const o1=a.createOscillator(); o1.type="triangle"; o1.frequency.value=f;
  const o2=a.createOscillator(); o2.type="sine"; o2.frequency.value=f*2;
  const g2=a.createGain(); g2.gain.value=.22;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t0); o2.start(t0); o1.stop(end+.5); o2.stop(end+.5);
}
function tick(strong){
  const a=ac(), t0=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.frequency.value=strong?1600:1100; g.gain.setValueAtTime(.18,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.05);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+.06);
}

const CSSV={}; function css(v){return CSSV[v]??=getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function makeBoard(canvas,{fallH=0,keyH=110,onPress}){
  const B={canvas,fallH,keyH,lo:48,hi:84,lay:null,W:0,onPress,flash:new Map(),good:new Map(),bad:new Map(),hint:new Set(),labels:true};
  B.setRange=(lo,hi)=>{B.lo=lo;B.hi=hi;B.resize();};
  B.resize=()=>{
    const wrap=canvas.parentElement; const whites=[]; for(let m=B.lo;m<=B.hi;m++) if(!isBlack(m)) whites.push(m);
    const W=Math.max(wrap.clientWidth-20,whites.length*15); B.W=W;
    const ww=W/whites.length, pos={};
    whites.forEach((m,i)=>pos[m]={x:i*ww,w:ww,b:false});
    for(let m=B.lo;m<=B.hi;m++) if(isBlack(m)&&pos[m-1]) pos[m]={x:pos[m-1].x+ww*.68,w:ww*.64,b:true};
    B.lay={whites,ww,pos};
    const H=B.fallH+B.keyH, dpr=window.devicePixelRatio||1;
    canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+"px"; canvas.style.height=H+"px";
    canvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
  };
  B.hit=(x,y)=>{
    if(y<B.fallH) return null; const ky=y-B.fallH, {pos}=B.lay;
    if(ky<B.keyH*.62) for(const m in pos){const p=pos[m]; if(p.b&&x>=p.x&&x<=p.x+p.w) return +m;}
    for(const m in pos){const p=pos[m]; if(!p.b&&x>=p.x&&x<p.x+p.w) return +m;}
    return null;
  };
  B.press=(m,src)=>{ if(m==null) return; tone(m,.45); B.flash.set(m,performance.now()+260); B.onPress?.(m,src); };
  canvas.addEventListener("pointerdown",e=>{const r=canvas.getBoundingClientRect(); B.press(B.hit(e.clientX-r.left,e.clientY-r.top),"screen");});
  B.drawKeys=(ctx,lit)=>{
    const {pos}=B.lay, y0=B.fallH, H=B.keyH, now=performance.now(), rh=css("--rh"), lh=css("--lh");
    // 红 = 弹错，绿 = 弹对，淡蓝 = 只是听到/按到
    const col=m=>{ if((B.bad.get(m)||0)>now) return "#FF8A8A"; if((B.good.get(m)||0)>now) return "#7FE0A6"; if((B.flash.get(m)||0)>now) return "#B9CCFF"; const l=lit?.get(m); if(l) return l==="l"?lh:rh; return null; };
    ctx.font="600 11px "+css("--f-mono");
    ctx.textAlign="center";
    for(const m of B.lay.whites){const p=pos[m];
      ctx.fillStyle=col(m)||"#FAF8F2"; ctx.fillRect(p.x+.5,y0,p.w-1,H);
      if(B.hint.has(m)){ctx.strokeStyle=css("--rh");ctx.lineWidth=3;ctx.strokeRect(p.x+2,y0+2,p.w-4,H-4);}
      if(B.labels||m%12===0){ctx.fillStyle=m%12===0?"#137A86":"#7A7F88"; ctx.fillText(m%12===0?nameOf(m):NAMES[m%12],p.x+p.w/2,y0+H-8);}
    }
    for(const m in pos){const p=pos[m]; if(!p.b) continue;
      ctx.fillStyle=col(+m)||"#1A1B20"; ctx.fillRect(p.x,y0,p.w,H*.62);
      if(B.hint.has(+m)){ctx.strokeStyle=css("--rh");ctx.lineWidth=3;ctx.strokeRect(p.x+1.5,y0+1.5,p.w-3,H*.62-3);}
    }
  };
  return B;
}

function binDb(f){ const i=f*MIC.an.fftSize/AC.sampleRate, a=Math.floor(i); if(a<1||a+1>=MIC.fd.length) return -200; return Math.max(MIC.fd[a],MIC.fd[a+1]); }
// 谐波和：把一个音的前 6 个泛音能量加起来。低音（C2 这类）基音很弱，靠泛音也能认出来
const HW=[1,1,1,1,.8,.7];

// rose：这个音自己的基音或第 2 泛音比按键前明显变响了。杂音、旧音的余音、别的音的泛音都不算新弹的音

function micFrame(now){
  MIC.an.getFloatTimeDomainData(MIC.td); let s=0; const n=1024, td=MIC.td;
  for(let i=td.length-n;i<td.length;i++) s+=td[i]*td[i];
  const rms=Math.sqrt(s/n);
  MIC.an.getFloatFrequencyData(MIC.fd);
  const E=MIC.prevE; MIC.prevE=MIC.E; MIC.E=E; for(let m=36;m<=96;m++) E[m]=hsum(m).lo;
  // 开麦头 0.7 秒：先听环境噪音有多大，之后只有明显比环境响的声音才算按键
  if(now-MIC.t0<700){ MIC.nf=Math.min(MIC.nf,rms); MIC.slow=rms; micHud("正在听环境声音，先别弹…"); return; }
  MIC.nf=rms<MIC.nf?rms:MIC.nf*1.002; // 安静时立刻跟下来，响的时候慢慢往上爬

  if(rms>Math.max(.006,MIC.nf*4)&&rms>MIC.slow*1.6){ if(now-(MIC.rising||0)>120){ MIC.pre=MIC.prevE.slice(); MIC.onset=now; } MIC.rising=now; }

  let best=null,bs=0;
  if(rms>.004){ for(let m=36;m<=96;m++){ const a=hsum(m); if(a.ok&&rose(m)&&a.s>bs){bs=a.s;best=m;} }
    // 高八度的音能解释差不多的能量，就选高八度（避免 G4 被认成 G3、G2）
    // 但如果这个音的第 3、5 泛音（高八度的音没有的）也在响，说明真是这个低音（例如 C3 的基音很弱，不能因此认成 C4）
    while(best!=null&&best+12<=96){ const u=hsum(best+12), f=440*2**((best-69)/12), odd=Math.max(binDb(f*3),binDb(f*5));
      if(u.ok&&rose(best+12)&&u.s>.8*hsum(best).s&&odd<u.pk-18) best+=12; else break; }
    if(best!=null&&hsum(best).pk<MIC.floor+MIC.sens) best=null; }
  // 同一个音连续 4 帧才算数；每次按键（起音）只报一个音，然后一直显示到下一次按键
  if(best!=null&&best===MIC.cand) MIC.candN++; else {MIC.cand=best; MIC.candN=1;}
  if(MIC.cand!=null&&MIC.candN>=4&&MIC.onset>(MIC.emitAt||0)&&now-MIC.onset<350&&rose(MIC.cand)){ MIC.emitAt=now; MIC.shown=MIC.cand; MIC.shownAt=now; micNote(MIC.cand,now); }
  if(rms<.003&&now-(MIC.shownAt||0)>800) MIC.shown=null;
  MIC.heard=MIC.shown;
  micHud(`听到：${MIC.shown!=null?nameOf(MIC.shown):"—"}  音量 ${"▮".repeat(Math.min(8,Math.round(rms*120)))}${MIC.nf>.02?"  · 环境偏吵":""}`);
}
function micHud(t){ const el=document.getElementById("micHud"); if(el&&el.textContent!==t) el.textContent=t; }



/* ===================== 播放器（下落音符） ===================== */
let BD=null, ACT=null; // 当前画面上的键盘，以及它在干什么：player / try / quiz
const WIN=.4; // 跟拍模式允许的误差（拍）
const P={key:null,ex:null,notes:[],len:0,bpm:72,speed:.7,mode:"wait",hand:"r",metro:true,playing:false,tb:-4,next:0,groups:[],gi:0,lit:new Map(),hits:0,miss:0,combo:0,best:0,fx:[],sec:0,finished:null,onDone:null,lastBeat:-99};
const userHand=n=>P.mode!=="demo"&&(P.hand==="both"||P.hand===n.h);
const hasHand=h=>P.notes.some(n=>n.h===h);
function setEx(ex,key){
  stop(); P.key=key; P.ex=ex; const c=compile(ex); P.notes=c.notes; P.len=c.len; P.bpm=+ex.bpm||72;
  if(P.hand==="both"&&!(hasHand("r")&&hasHand("l"))) P.hand=hasHand("r")?"r":"l";
  if(P.hand==="r"&&!hasHand("r")) P.hand="l"; if(P.hand==="l"&&!hasHand("l")) P.hand="r";
  reset();
}
function fitRange(notes){
  let lo=48,hi=72;
  if(notes.length){const ms=notes.map(n=>n.m); lo=12*Math.floor(Math.min(...ms)/12); hi=12*Math.floor(Math.max(...ms)/12)+12; if(hi-lo<12) hi+=12;}
  BD?.setRange(lo,Math.min(hi,108));
}
function reset(){
  P.tb=-4; P.sec=0; P.next=0; P.gi=0; P.hits=0; P.miss=0; P.combo=0; P.best=0; P.fx=[]; P.lit.clear(); P.finished=null; P.lastBeat=-99;
  const g=new Map(); for(const n of P.notes) if(userHand(n)){ if(!g.has(n.s)) g.set(n.s,{s:n.s,ms:new Set(),hit:new Set()}); g.get(n.s).ms.add(n.m); }
  P.groups=[...g.values()].sort((a,b)=>a.s-b.s);
  if(BD) BD.hint=new Set();
}
// 弹对：键上方冒光圈和文字，连对数 +1；弹错：红色，连对归零
function hitFx(m,ok){
  const now=performance.now(), g=P.groups[P.gi];
  if(ok){ P.combo++; P.best=Math.max(P.best,P.combo); mark(m,true); }
  else { if(P.combo>=5) P.fx.push({m:null,t:now,txt:"连对中断"}); P.combo=0; mark(m,false); }
  let txt=null; if(ok&&P.mode==="timing"&&g){ const d=Math.abs(P.tb-g.s); txt=d<.12?"完美":d<.25?"很好":"还行"; }
  if(!ok) txt="✕";
  P.fx.push({m,t:now,ok,txt}); if(P.fx.length>24) P.fx.shift();
}
let wake=null;
function wakeOn(){try{navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}}
function play(){ ac(); if(P.finished) reset(); P.playing=true; P.last=performance.now(); if(P.groups[0]&&!P.groups[0].armed) P.groups[0].armed=P.last; wakeOn(); hud(); }
function stop(){ if(P.playing) save(); P.playing=false; hud(); }
function advanceGroup(now){ const g=P.groups[P.gi]; if(g.waitFrom){ g.waited=(now-g.waitFrom)/1000; P.ramp=now; } P.gi++; const n=P.groups[P.gi]; if(n) n.armed=now+60; }
function playerTick(now,dt){
  if(!P.playing) return;
  let g=P.groups[P.gi], k=1;
  // wait mode: glide into the stop over the last 0.3 beat and ease back up after a hit, instead of a hard stop/start
  if(P.mode==="wait"){ if(g&&g.hit.size<g.ms.size&&P.tb<g.s) k=Math.max(.25,Math.min(1,(g.s-P.tb)/.3)); k=Math.min(k,.35+(now-(P.ramp||0))/350); }
  let nt=P.tb+dt*P.bpm/60*P.speed*Math.min(1,k);
  if(P.mode==="wait"&&g&&nt>=g.s){ nt=g.s; if(!g.waitFrom) g.waitFrom=now; }
  if(P.mode==="timing") while(g&&nt>g.s+WIN){ if(g.hit.size<g.ms.size){ if(P.combo>=5) P.fx.push({m:null,t:now,txt:"连对中断"}); P.combo=0; } advanceGroup(now); g=P.groups[P.gi]; }
  P.sec+=dt;
  while(P.next<P.notes.length&&P.notes[P.next].s<nt){
    const n=P.notes[P.next++];
    if(!userHand(n)){ tone(n.m,n.d*60/P.bpm/P.speed,(n.h==="l"?.6:.8)*(MIC.on&&P.mode!=="demo"?.3:1)); P.lit.set(n.m,{until:n.s+n.d,h:n.h}); }
  }
  const beat=Math.floor(nt);
  if(beat>P.lastBeat){ P.lastBeat=beat; if(P.metro||beat<0) tick(((beat%4)+4)%4===0); }
  P.tb=nt;
  const win=P.mode==="wait"?.75:WIN;
  if(MIC.on&&P.mode!=="demo"&&g&&P.tb>=g.s-win&&MIC.onset>(g.armed||0)){
    let ch=false; for(const m of g.ms) if(!g.hit.has(m)&&present(m)){g.hit.add(m);P.hits++;hitFx(m,true);ch=true;}
    if(g.hit.size===g.ms.size) advanceGroup(now); if(ch) hud();
  }
  for(const [m,v] of P.lit) if(v.until<=P.tb) P.lit.delete(m);
  const gg=P.groups[P.gi];
  BD.hint=new Set(P.mode!=="demo"&&gg&&P.tb>=gg.s-(P.mode==="wait"?.75:1)?[...gg.ms].filter(m=>!gg.hit.has(m)):[]);
  if(P.tb>=P.len+.5&&P.gi>=P.groups.length) finish();
}
function playerKey(m){
  if(P.mode==="demo"||!P.playing) return;
  const g=P.groups[P.gi], win=P.mode==="wait"?.75:WIN;
  if(g&&g.ms.has(m)&&P.tb>=g.s-win){ if(!g.hit.has(m)){g.hit.add(m);P.hits++;hitFx(m,true);} if(g.hit.size===g.ms.size) advanceGroup(performance.now()); }
  else { P.miss++; hitFx(m,false); }
  hud();
}
function finish(){
  P.playing=false; try{wake?.release();}catch(e){} wake=null;
  const total=P.groups.reduce((a,g)=>a+g.ms.size,0);
  const acc=P.mode!=="demo"&&total?Math.round(100*P.hits/Math.max(total,P.hits+P.miss)):null;
  const by={}; for(const g of P.groups) if(g.waited>1.2){const b=Math.floor(g.s/4)+1; by[b]=(by[b]||0)+g.waited;}
  const slow=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([b,w])=>[+b,Math.round(w*10)/10]);
  P.finished={acc,slow};
  if(acc!=null) S.log=[{d:today(),n:P.key==="song"?(S.song.name||"我的曲谱"):(P.ex.n||""),acc,sec:Math.round(P.sec),slow,mode:P.mode,mic:MIC.on},...(S.log||[])].slice(0,60);
  save(); hud(); P.onDone?.(acc,slow);
}
function drawPlayer(){
  const B=BD, ctx=B.canvas.getContext("2d"), W=B.W, F=B.fallH, ppb=F/4.5, {pos}=B.lay;
  ctx.fillStyle=css("--stage"); ctx.fillRect(0,0,W,F);
  for(let b=Math.ceil(P.tb);b<P.tb+5;b++){const y=F-(b-P.tb)*ppb; if(y<0) continue; ctx.fillStyle=b%4===0?"rgba(255,255,255,.16)":"rgba(255,255,255,.05)"; ctx.fillRect(0,y,W,b%4===0?2:1);}
  ctx.fillStyle="rgba(255,255,255,.04)"; for(const m of B.lay.whites) if(m%12===0) ctx.fillRect(pos[m].x,0,1,F);
  const rh=css("--rh"), lh=css("--lh");
  ctx.font="600 10px "+css("--f-mono"); ctx.textAlign="center";
  for(const n of P.notes){
    if(n.s>P.tb+5) break; if(n.s+n.d<P.tb-.05) continue;
    const p=pos[n.m]; if(!p) continue;
    const yb=F-(n.s-P.tb)*ppb, yt=Math.max(0,F-(n.s+n.d-P.tb)*ppb+2); if(yb<=0) continue;
    const ybc=Math.min(yb,F);
    ctx.globalAlpha=P.mode!=="demo"&&!userHand(n)?.35:1;
    ctx.fillStyle=n.h==="l"?lh:rh;
    const x=p.x+(p.b?0:2), w=p.w-(p.b?0:4);
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,yt,w,ybc-yt,5):ctx.rect(x,yt,w,ybc-yt); ctx.fill();
    if(ybc-yt>14&&w>11){ctx.fillStyle="#061015"; ctx.fillText(NAMES[n.m%12],x+w/2,ybc-5);}
  }
  ctx.globalAlpha=1;
  if(P.mode==="timing"){ ctx.fillStyle="rgba(255,211,110,.5)"; ctx.fillRect(0,F-2,W,2); }
  if(P.tb<0&&P.playing){ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font="44px "+css("--f-display"); ctx.fillText(String(Math.ceil(-P.tb)),W/2,F/2);}
  const gw=P.groups[P.gi];
  if(P.mode==="wait"&&P.playing&&gw&&P.tb>=gw.s){
    const stuck=gw.waitFrom&&performance.now()-gw.waitFrom>3000;
    ctx.fillStyle="rgba(255,255,255,.8)"; ctx.font="14px "+css("--f-body");
    ctx.fillText(stuck?"要按："+[...gw.ms].filter(m=>!gw.hit.has(m)).map(nameOf).join(" + "):"弹亮框里的键",W/2,20);
  }
  const now=performance.now();
  for(const f of P.fx){ const k=(now-f.t)/600; if(k>1) continue; const e=1-(1-k)**2;
    if(f.m==null){ ctx.globalAlpha=1-k; ctx.fillStyle=css("--bad"); ctx.font="600 15px "+css("--f-body"); ctx.fillText(f.txt,W/2,F*.45-e*20); continue; }
    const p=pos[f.m]; if(!p) continue; const cx=p.x+p.w/2;
    ctx.globalAlpha=(1-k)*.9; ctx.strokeStyle=f.ok?css("--good"):css("--bad"); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,F-4,6+e*22,0,Math.PI*2); ctx.stroke();
    if(f.ok){ ctx.fillStyle=css("--moon"); for(let i=0;i<5;i++){ const a=-Math.PI*(.15+.7*i/4); ctx.fillRect(cx+Math.cos(a)*e*30-1.5,F-4+Math.sin(a)*e*30-1.5,3,3); } }
    if(f.txt){ ctx.globalAlpha=1-k; ctx.font="700 14px "+css("--f-body"); ctx.lineWidth=4; ctx.strokeStyle="#060815"; ctx.strokeText(f.txt,cx,F-30-e*26); ctx.fillStyle=f.ok?css("--moon"):css("--bad"); ctx.fillText(f.txt,cx,F-30-e*26); }
  }
  ctx.globalAlpha=1;
  if(P.combo>=3&&P.mode!=="demo"){ const last=P.fx.findLast?.(f=>f.ok); const k=last?Math.min(1,(now-last.t)/180):1;
    ctx.fillStyle=css("--moon"); ctx.textAlign="right"; ctx.font=`${Math.round(18+6*(1-k))}px `+css("--f-display"); ctx.fillText("连对 ×"+P.combo,W-10,26); ctx.textAlign="center"; }
  const lit=new Map(); for(const [m,v] of P.lit) lit.set(m,v.h);
  B.drawKeys(ctx,lit);
}
function hud(){
  const el=document.getElementById("hud"); if(!el) return;
  const pb=document.getElementById("playBtn"); if(pb) pb.textContent=P.playing?"暂停":(P.finished?"再来一次":"开始弹");
  const bar=Math.max(0,Math.floor(P.tb/4)+1), tot=Math.max(1,Math.ceil(P.len/4));

  el.innerHTML=s;
}

const T={list:[],i:0,groups:[],gi:0,armed:0,done:false};
function tryLoad(i){
  T.i=i; T.done=false; const r=parseVoice(T.list[i].n,"r",4);
  const g=new Map(); for(const n of r.notes){ if(!g.has(n.s)) g.set(n.s,{ms:new Set(),hit:new Set()}); g.get(n.s).ms.add(n.m); }
  T.groups=[...g.values()]; T.gi=0; T.armed=performance.now();
  fitRange(r.notes); tryHint();
}
function tryHint(){ const g=T.groups[T.gi]; if(BD) BD.hint=new Set(g?[...g.ms].filter(m=>!g.hit.has(m)):[]); }
function tryHit(m){
  if(T.done) return; const g=T.groups[T.gi]; if(!g) return;
  const fb=document.getElementById("fb");
  if(g.ms.has(m)){ g.hit.add(m); mark(m,true);
    if(g.hit.size===g.ms.size){ T.gi++; T.armed=performance.now();
      if(T.gi>=T.groups.length){ T.done=true; if(fb){fb.className="fb ok";fb.textContent=rnd(["很好！","对了！","漂亮！","就是这样！"]);retrig(fb,"pop");}
        setTimeout(()=>{ if(T.i+1<T.list.length){ tryLoad(T.i+1); renderFlow(); } else stepPass(3); },900); }
    }
    tryHint();
  } else { mark(m,false); if(fb){ fb.className="fb no"; retrig(fb,"shake"); fb.textContent=`这是 ${nameOf(m)}，要弹的是亮框里的 ${[...g.ms].filter(x=>!g.hit.has(x)).map(nameOf).join(" + ")}`; } }
}
function tryTick(now){
  if(!MIC.on||T.done) return; const g=T.groups[T.gi];
  if(g&&g.ms.size>1&&MIC.onset>T.armed) for(const m of g.ms) if(!g.hit.has(m)&&present(m)) tryHit(m);

const CHORDS={C:[0,4,7],Dm:[2,5,9],Em:[4,7,11],F:[5,9,0],G:[7,11,2],Am:[9,0,4]};
const Q={mode:"white",i:0,score:0,cur:null,sel:new Set(),locked:false,over:false};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function qStart(mode){ Object.assign(Q,{mode,i:0,score:0,over:false}); qNew(false); }
function qNew(draw=true){
  Q.sel=new Set(); Q.locked=false; Q.at=performance.now();
  const w4=[60,62,64,65,67,69,71], bl=[61,63,66,68,70];
  if(Q.mode==="white") Q.cur={m:rnd([...w4,...w4.map(x=>x-12),72])};
  if(Q.mode==="black") Q.cur={m:rnd([...bl,...bl.map(x=>x-12)])};
  if(Q.mode==="staff") Q.cur={m:rnd([60,62,64,65,67,69,71,72,74,76,77,79,81])};
  if(Q.mode==="jianpu"){const deg=Math.floor(Math.random()*7), oct=rnd([3,4,4,5]); Q.cur={deg,oct,m:12*(oct+1)+[0,2,4,5,7,9,11][deg]};}
  if(Q.mode==="chord"){const n=rnd(Object.keys(CHORDS)); Q.cur={name:n,pcs:CHORDS[n]};}
  if(BD) BD.hint=new Set(["white","black"].includes(Q.mode)?[Q.cur.m]:[]);
  if(draw) renderFlow();
}
function qAnswer(ok,reveal){
  if(Q.locked) return; Q.locked=true; if(ok) Q.score++;
  const fb=document.getElementById("fb"); if(fb){fb.className="fb "+(ok?"ok":"no"); fb.textContent=ok?rnd(["对了！","没错！","好眼力！"]):"正确答案：" +reveal; retrig(fb,ok?"pop":"shake");}
  if(!ok) buzz(30); if(Q.cur.m!=null&&BD&&!ok) BD.hint=new Set([Q.cur.m]);
  if(Q.cur.m!=null) setTimeout(()=>tone(Q.cur.m,.6),ok?0:150); else Q.cur.pcs.forEach(pc=>tone(60+pc+(pc<Q.cur.pcs[0]?12:0),.8));
  setTimeout(()=>{ Q.i++; if(Q.i>=10){ Q.over=true; S.quizBest[Q.mode]=Math.max(S.quizBest[Q.mode]||0,Q.score); save();
      const st=Q.score>=10?3:Q.score>=9?2:Q.score>=8?1:0; showResult({stars:st,pass:st>=1,title:`${Q.score} / 10`,msg:st?"测验通过":"差一点，8 题过关，再来一局"}); }
    else qNew(); },ok?650:1500);
}
function qPress(m){
  if(Q.over||Q.locked||!Q.cur) return;
  if(Q.mode!=="chord") mark(m,Q.mode==="jianpu"?m===Q.cur.m:m%12===Q.cur.m%12);
  if(["white","black","staff"].includes(Q.mode)){ const c=Q.cur.m%12; qAnswer(m%12===c,Q.mode==="black"?NAMES[c]+"/"+NAMES[c+1]+"b":NAMES[c]); return; }
  if(Q.mode==="jianpu") qAnswer(m===Q.cur.m,nameOf(Q.cur.m));
  if(Q.mode==="chord"){ Q.sel.has(m)?Q.sel.delete(m):Q.sel.add(m); BD.hint=new Set(Q.sel); const el=document.getElementById("qsel"); if(el) el.textContent=[...Q.sel].sort((a,b)=>a-b).map(nameOf).join(" ")||"还没选";
    const pcs=new Set([...Q.sel].map(x=>x%12)); if(Q.sel.size>=3&&Q.cur.pcs.every(x=>pcs.has(x))&&pcs.size===3) qAnswer(true,""); }
}
// mic can mishear (noise, the answer tone's tail): a wrong mic note only hints, never costs the question
function qMic(m){
  if(Q.over||Q.locked||!Q.cur||performance.now()-(Q.at||0)<600) return;
  const ok=Q.mode==="jianpu"?m===Q.cur.m:m%12===Q.cur.m%12;
  if(Q.mode==="chord"||ok) return qPress(m);
  mark(m,false); const fb=document.getElementById("fb");
  if(fb){ fb.className="fb"; fb.textContent=`听到 ${nameOf(m)}，不是它，再弹一次（不算错）`; retrig(fb,"pop"); }
}
function qChordCheck(){ const pcs=new Set([...Q.sel].map(m=>m%12)); qAnswer(pcs.size===3&&Q.cur.pcs.every(x=>pcs.has(x)),Q.cur.pcs.map(pc=>NAMES[pc]).join(" ")); }
function staffSVG(m){
  const letter=[0,0,1,1,2,3,3,4,4,5,5,6][m%12], idx=(Math.floor(m/12)-1)*7+letter, gap=12, bottom=96;
  const y=bottom-(idx-30)*gap/2, x=150, ink="currentColor";
  let s=`<svg viewBox="0 0 260 130" width="260" height="130" role="img" aria-label="五线谱上的一个音符">`;
  for(let i=0;i<5;i++) s+=`<line x1="10" x2="250" y1="${bottom-i*gap}" y2="${bottom-i*gap}" stroke="${ink}" stroke-width="1.2"/>`;
  s+=`<text x="14" y="${bottom+8}" font-size="62" font-family="'Noto Music',serif" fill="${ink}">𝄞</text>`;
  for(let li=28;li>=idx;li-=2) s+=`<line x1="${x-16}" x2="${x+16}" y1="${bottom-(li-30)*gap/2}" y2="${bottom-(li-30)*gap/2}" stroke="${ink}" stroke-width="1.2"/>`;
  for(let li=40;li<=idx;li+=2) s+=`<line x1="${x-16}" x2="${x+16}" y1="${bottom-(li-30)*gap/2}" y2="${bottom-(li-30)*gap/2}" stroke="${ink}" stroke-width="1.2"/>`;
  s+=`<ellipse cx="${x}" cy="${y}" rx="8" ry="6" transform="rotate(-20 ${x} ${y})" fill="${ink}"/></svg>`;
  return s;
}

const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,";":16};

  const cols=["#FFD36E","#3DDBC8","#B79BFF","#FF9FB2","#EEF0FF"];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*60,y:H*.32,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:5+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();

}

  <div class="steps">${steps.map((s,i)=>{const n=stars(lv,i), open=stepOpen(lv,i);
    return `<button class="step ${n?"ok":""} ${open?"":"lock"}" data-step="${lv}:${i}" ${open?"":'aria-disabled="true"'}><span class="n">${n?"✓":i+1}</span><span><b>${esc(s.t)}</b><span class="small muted">${esc(s.d)}</span></span><span class="stars small">${"★".repeat(n)}<span class="off">${"★".repeat(3-n)}</span></span></button>`;}).join("")}</div>
  <button class="big" data-step="${lv}:${next<0?0:next}">${next<0?"再练一遍":next===0?"开始":"继续"}</button></div></div>`;
}
function vRoom(){
  const items=[]; for(let lv=1;lv<=NLV&&levelOpen(lv);lv++) L[lv].ex.forEach((e,i)=>items.push([lv+"-"+i,`第 ${lv} 关 · ${e.n}`]));
  items.push(["song","我的曲谱 · "+(S.song.name||"未命名")]);
  const errs=compile(S.song).errs, both=hasHand("r")&&hasHand("l");
  return `${topBar()}<div class="stack">
  <div class="card stack"><label class="f">自由练习<select id="exSel">${items.map(([k,n])=>`<option value="${k}" ${k===P.key?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
  <div class="ctl" style="justify-content:flex-start">${["wait","timing","demo"].map(m=>`<button class="chip ${P.mode===m?"on":""}" data-mode="${m}">${{wait:"等待模式",timing:"跟拍模式",demo:"示范"}[m]}</button>`).join("")}</div>
  <div class="ctl" style="justify-content:flex-start">${both?["r","l","both"].map(h=>`<button class="chip ${P.hand===h?"on":""}" data-hand="${h}">${{r:"右手",l:"左手",both:"双手"}[h]}</button>`).join(""):""}<button class="chip" data-act="slower">慢</button><span class="chip mono">${Math.round(P.speed*100)}%</span><button class="chip" data-act="faster">快</button><button class="chip ${P.metro?"on":""}" data-act="metro">节拍器</button></div></div>
  <div class="stage-wrap"><canvas id="bd" tabindex="0" aria-label="下落音符和琴键"></canvas></div>
  <div class="hud" id="hud"></div>${micRow()}
  <button class="big" id="playBtn" data-act="play">开始弹</button>
  <div class="card stack"><div><h3>我的曲谱</h3><p class="small muted">把《失眠的夜》录在这里，第 13–15 关要用。写法：<span class="kbd">C D E:2</span> = C、D 各 1 拍，E 2 拍；<span class="kbd">F#</span> <span class="kbd">Bb</span> 黑键；<span class="kbd">A3+C4+E4:4</span> 和弦 4 拍；<span class="kbd">0:1</span> 休止；<span class="kbd">|</span> 小节线。右手默认第 4 八度，左手第 3 八度。</p><p class="small muted">谱在这里：<a href="${SHEET_URL}" target="_blank" rel="noopener" style="color:var(--rh)">虫虫钢琴 · 失眠的夜</a> · <a href="${SONG_URL}" target="_blank" rel="noopener" style="color:var(--rh)">原视频</a></p></div>
    <label class="f">曲名<input type="text" id="sgName" value="${esc(S.song.name||"")}"></label><label class="f">速度 BPM<input type="number" id="sgBpm" min="30" max="200" value="${+S.song.bpm||70}"></label>
    <label class="f">右手<textarea id="sgRh">${esc(S.song.rh||"")}</textarea></label><label class="f">左手<textarea id="sgLh">${esc(S.song.lh||"")}</textarea></label>
    <label class="f">备注（分段、和弦、卡住的地方）<textarea id="sgMemo" style="font-family:var(--f-body)">${esc(S.song.memo||"")}</textarea></label>
    <p class="small" style="color:${errs.length?"var(--bad)":"var(--muted)"}">${errs.length?"这些写法看不懂："+esc(errs.slice(0,6).join("  ")):"共 "+compile(S.song).notes.length+" 个音"}</p>
    <button class="big ghost" data-act="sgSave">保存并载入</button></div>
  <details class="card"><summary>AI 教练：问问题 / 简谱转练琴格式</summary><div class="stack" style="margin-top:12px">
    <div class="ctl" style="justify-content:flex-start"><button class="chip ${coachMode==="ask"?"on":""}" data-cm="ask">问问题</button><button class="chip ${coachMode==="convert"?"on":""}" data-cm="convert">简谱转练琴格式</button></div>
    <textarea id="cIn" placeholder="${coachMode==="ask"?"比如：左手八度够不到怎么办？":"贴简谱，写上 1=? 和拍号。例如：1=C 4/4  3 5 5. 6 | 5 3 2 1 -"}"></textarea>
    <div class="row"><button class="chip on" data-act="cGo">${coachMode==="ask"?"发送":"转换"}</button><button class="chip" data-act="cCopy">复制提示词</button></div>
    <div class="ai-out" id="cOut" aria-live="polite">${esc(coachOut)}</div><div id="cAct"></div>
    <p class="small muted">AI 只在 claude.ai 里能用；在独立网址里点「复制提示词」，拿去和 Claude 聊。</p></div></details>
  </div>`;
}
function vMe(){
  const days=[]; for(let i=6;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);days.push([t,Math.round((S.days[dkey(t)]?.sec||0)/60)]);}
  const mx=Math.max(S.goal,...days.map(d=>d[1]));
  const totMin=Math.round(Object.values(S.days).reduce((a,x)=>a+(x.sec||0),0)/60);
  const log=(S.log||[]).slice(0,20), done=WORLDS.flatMap(w=>w.lv).filter(levelDone).length;
  return `${topBar()}<div class="stack">
  <div class="kv"><div><span class="small muted">已通关</span><b>${done}/${NLV}</b></div><div><span class="small muted">星星</span><b style="color:var(--moon)">★ ${totalStars()}</b></div><div><span class="small muted">总练琴时间</span><b>${totMin} 分</b></div><div><span class="small muted">连续天数</span><b>${streak()} 天</b></div></div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><h3>最近 7 天（分钟）</h3><span class="small muted">每天目标 ${S.goal} 分</span></div>
  <div class="week">${days.map(([t,m])=>`<div><span class="mono">${m||""}</span><i style="height:${Math.round(80*m/mx)}%;${m>=S.goal?"background:var(--moon)":""}"></i><span>${"日一二三四五六"[t.getDay()]}</span></div>`).join("")}</div>
  <div class="ctl" style="justify-content:flex-start"><span class="small muted">每日目标</span>${[10,15,20,30].map(g=>`<button class="chip ${S.goal===g?"on":""}" data-goal="${g}">${g} 分</button>`).join("")}</div></div>
  <div class="card stack"><h3>练习记录</h3>${log.length?`<div style="overflow-x:auto"><table class="log"><thead><tr><th>日期</th><th>曲目</th><th>准确率</th><th>用时</th><th>卡住</th></tr></thead><tbody>${log.map(r=>`<tr><td class="mono">${r.d.slice(5)}</td><td>${esc(r.n)}${r.mode==="timing"?" · 跟拍":""}${r.mic?" · 听音":""}</td><td class="mono">${r.acc}%</td><td class="mono">${Math.floor(r.sec/60)}:${pad(r.sec%60)}</td><td>${r.slow?.length?r.slow.map(([b])=>"第 "+b+" 小节").join("、"):"—"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">弹完一首练习，这里会记下准确率、用时和卡住的小节。</p>`}</div>
  <div class="card stack"><h3>听音设置</h3><p class="small muted">听不到你弹的音：把门槛调小。没弹也乱跳：调大。</p><input type="range" id="sens" min="8" max="36" value="${MIC.sens}" aria-label="听音门槛"><div class="ctl" style="justify-content:flex-start"><button class="chip ${MIC.on?"on":""}" data-act="mic">听音 ${MIC.on?"开":"关"}</button><span class="small mono" id="micHud"></span></div>${MIC.msg&&!MIC.on?`<p class="small muted">${esc(MIC.msg)}</p>`:""}</div>
  <div class="card stack"><h3>重新开始</h3><p class="small muted">清空星星、记录和曲谱，回到第 1 关。</p><div class="row"><button class="chip" data-act="rst1">清空进度</button><span id="rst2"></span></div></div>
  <p class="small muted" style="text-align:center">${syncNote}</p></div>`;
}
function render(){
  $("nav").innerHTML=`<div>${[["path","路线"],["room","练琴房"],["me","我的"]].map(([k,n])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${ICONS[k]}<span>${n}</span></button>`).join("")}</div>`;
  if(tab!=="room"){ stop(); }
  $("app").innerHTML=({path:vPath,room:vRoom,me:vMe})[tab]();
  ACT=null; BD=null;
  if(tab==="room"){
    if(!P.key||(P.key!=="song"&&!L[+P.key.split("-")[0]])) setEx(L[1].ex[0],"1-0");
    P.onDone=null;
    mountBoard(Math.max(170,Math.min(340,window.innerHeight-560)),110); ACT="player"; fitRange(P.notes); hud();
  }
  if(tab==="path"){ const n=document.querySelector(".node.now"); if(n&&!render.scrolled){ render.scrolled=true; setTimeout(()=>n.scrollIntoView({block:"center"}),50); } }
}

/* ===================== AI 教练 ===================== */
let coachMode="ask", coachOut="", coachJSON=null;
function coachPrompt(text){
  const lv=curLv(), Lv=L[lv];
  const ctx=`你是一位耐心的钢琴老师，学生是零基础成年人，用中文回答，简短具体，少用术语，必要时给练习步骤。
学生情况：用电子琴自学，目标是弹出 Cuppix 改编的《失眠的夜》DJ 热搜版钢琴曲。现在在第 ${lv}/15 关「${Lv.t}」，本关目标：${Lv.goal}
已学过：${Array.from({length:lv},(_,i)=>L[i+1].t).join("、")}。`;
  if(coachMode==="ask") return `${ctx}\n\n学生的问题：\n${text}`;
  return `${ctx}
任务：把学生给的简谱（或音名）转换成练琴房格式。格式规则：音名 C D E F G A B，可加 # 或 b，可加八度数字（C4 = 中央 C；右手不写八度默认 4，左手默认 3）；":数字" 是拍数（默认 1 拍，0.5 = 八分音符，1.5 = 附点四分）；同时按的音用 + 连接，如 A3+C4+E4:4；休止写 0:拍数；小节之间写 |。
简谱换算：先看 1=? 确定 1 对应的音，上加点 +1 八度，下加点 -1 八度；"-" 加 1 拍；下划线一条 = 0.5 拍；附点 ×1.5。
只返回 JSON：{"rh":"右手字符串","lh":"左手字符串，没有就空字符串","bpm":数字,"note":"一两句说明，包括你不确定的地方"}
学生给的谱：
${text}`;
}



/* ===================== 事件 ===================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(t.dataset.tab){ const ch=tab!==t.dataset.tab; tab=t.dataset.tab; render(); window.scrollTo({top:0}); if(ch) anim($("app"),[{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}]); return; }
  if(t.dataset.lv){ openSheet(+t.dataset.lv); return; }
  if(t.dataset.step){ const [lv,i]=t.dataset.step.split(":").map(Number); if(!stepOpen(lv,i)){toast("先完成前面的步骤");return;} openStep(lv,i); return; }
  if(a==="fs"){ fsToggle(); return; }
  if(a==="sheetClose"||a==="closeCele"||a==="close"){ uiClose(); return; }
  if(a==="cnext"){ F.card++; F.dir=1; renderFlow(); return; }
  if(a==="cprev"){ F.card=Math.max(0,F.card-1); F.dir=-1; renderFlow(); return; }
  if(a==="cdone"){ stepPass(3); return; }
  if(a==="next"){ nextStep(); return; }
  if(a==="retry"){ openStep(F.lv,F.si); return; }
  if(a==="toRoom"){ closeFlow(); tab="room"; P.key=null; setEx(S.song,"song"); render(); setTimeout(()=>document.getElementById("sgRh")?.scrollIntoView({block:"center"}),50); return; }
  if(a==="mic"){ await micToggle(); return; }
  if(a==="play"){ if(P.mode==="demo"&&F.open){ const b=stepsOf(F.lv)[F.si].k==="boss"?bossCfg(F.lv):null; P.mode=b?b.mode:"wait"; reset(); } P.playing?stop():play(); return; }
  if(a==="demo"){ if(P.playing&&P.mode==="demo"){stop();renderFlow();return;} P.mode="demo"; reset(); play(); renderFlow(); return; }
  if(a==="metro"){ P.metro=!P.metro; t.classList.toggle("on",P.metro); return; }
  if(a==="slower"||a==="faster"){ P.speed=Math.round(Math.min(1.3,Math.max(.3,P.speed+(a==="faster"?.1:-.1)))*10)/10; rerender(); return; }
  if(t.dataset.hand){ P.hand=t.dataset.hand; stop(); reset(); rerender(); return; }
  if(t.dataset.mode){ P.mode=t.dataset.mode; stop(); reset(); render(); return; }
  if(t.dataset.goal){ S.goal=+t.dataset.goal; save(); render(); return; }
  if(t.dataset.ans){ const m=Q.cur.m, c=m%12; qAnswer(Q.mode==="black"?String(c)===t.dataset.ans:NAMES[c]===t.dataset.ans,Q.mode==="black"?NAMES[c]+"/"+NAMES[c+1]+"b":NAMES[c]); return; }
  if(a==="qok"){ qChordCheck(); return; }
  if(a==="qclr"){ Q.sel.clear(); BD.hint=new Set(); $("qsel").textContent="还没选"; return; }
  if(a==="sgSave"){ S.song={name:$("sgName").value.trim()||"我的曲子",bpm:Math.min(200,Math.max(30,+$("sgBpm").value||70)),rh:$("sgRh").value,lh:$("sgLh").value,memo:$("sgMemo").value}; save(); setEx(S.song,"song"); render(); toast("已保存"); return; }
  if(t.dataset.cm){ coachMode=t.dataset.cm; coachOut=""; coachJSON=null; render(); document.querySelector("details.card")?.setAttribute("open",""); return; }
  if(a==="cCopy"){ const p=coachPrompt($("cIn").value.trim()||"（在这里写你的问题）"); try{await navigator.clipboard.writeText(p);toast("提示词已复制");}catch(err){$("cOut").textContent=p;toast("复制不了，已显示在下面，手动复制");} return; }
  if(a==="cGo"){
    const text=$("cIn").value.trim(); if(!text){toast("先写点内容");return;}
    const out=$("cOut"), act=$("cAct"); act.innerHTML="";
    const sample=await window.claude?.use?.("sample");
    if(!sample){ out.textContent="这里用不了 AI。点「复制提示词」拿去和 Claude 的聊天里问。"; return; }
    t.disabled=true; out.textContent="思考中…";
    try{
      if(coachMode==="ask"){ const r=await sample(coachPrompt(text),{cache:false,onText:({text})=>{out.textContent=text;}}); coachOut=r.text; out.textContent=r.text; }
      else{ const j=await sample.json(coachPrompt(text),{cache:false}); coachJSON=j;
        coachOut=`右手：${j.rh||"（无）"}\n左手：${j.lh||"（无）"}\n速度：${j.bpm||"?"} BPM\n\n${j.note||""}`; out.textContent=coachOut;
        act.innerHTML=`<div class="row"><button class="chip on" data-act="cApply">追加到我的曲谱</button><button class="chip" data-act="cReplace">替换我的曲谱</button></div>`; }
    }catch(err){ out.textContent=err?.code==="rate_limited"?"问得太快了，等一分钟再试。":"出错了："+(err?.message||err); }
    t.disabled=false; return;
  }
  if(a==="cApply"||a==="cReplace"){
    const j=coachJSON||{}, add=a==="cApply", join=(x,y)=>add&&x?.trim()?x.trim()+" |\n"+(y||""):(y||"");
    S.song={...S.song,rh:join(S.song.rh,j.rh),lh:join(S.song.lh,j.lh),bpm:(!add||!S.song.rh)&&j.bpm?j.bpm:S.song.bpm};
    save(); setEx(S.song,"song"); render(); toast(add?"已追加":"已替换"); return;
  }
  if(a==="rst1"){ $("rst2").innerHTML=`<button class="chip" data-act="rst3" style="background:var(--bad);color:#2a0606">确定清空，不能恢复</button>`; return; }
  if(a==="rst3"){ S=blank(); save(); P.key=null; tab="path"; render(); toast("已清空"); return; }
});
document.addEventListener("change",e=>{ if(e.target.id==="exSel"){ const k=e.target.value; if(k==="song") setEx(S.song,"song"); else {const [lv,i]=k.split("-").map(Number); setEx(L[lv].ex[i],k);} render(); } });
document.addEventListener("input",e=>{ if(e.target.id==="sens"){ MIC.sens=+e.target.value; try{localStorage.setItem(KEY+"-sens",MIC.sens);}catch(err){} } });
render();
</script>

</body></html>
